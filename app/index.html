<title>Quackulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#F6EEE3; --panel:#FFFFFF; --panel2:#F9E4E9; --ink:#2A2230; --ink2:#6B5E70; --line:#E5D6CF;
  --potion:#C9456A; --potion-soft:#F3B9C8; --iron:#3A3543; --ruby:#D2333F; --gold:#B98A2C; --go:#2F8F5B;
  --coin:#E9C46A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221F27; --panel:#2E2A35; --panel2:#3A2C36; --ink:#F3ECEF; --ink2:#B9AEBE; --line:#463F4E;
    --potion:#E8698D; --potion-soft:#6B3A4B; --iron:#17151B; --ruby:#F05562; --gold:#E0B25A; --go:#4FBF7E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221F27; --panel:#2E2A35; --panel2:#3A2C36; --ink:#F3ECEF; --ink2:#B9AEBE; --line:#463F4E;
  --potion:#E8698D; --potion-soft:#6B3A4B; --iron:#17151B; --ruby:#F05562; --gold:#E0B25A; --go:#4FBF7E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.display{font-family:Fraunces,Georgia,serif;text-wrap:balance;margin:0}
.app{max-width:520px;margin:0 auto;padding:0 14px 110px}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 8px}
.top h1{font-size:26px;font-weight:900;letter-spacing:-.01em}
.top .sub{color:var(--ink2);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:18px;font-weight:700;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
input[type=number],select{font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:100%}
button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--potion);outline-offset:2px}
button.primary{background:var(--potion);border-color:var(--potion);color:#fff}
button.ghost{background:transparent}
button.small{padding:6px 10px;font-size:14px}
button:disabled{opacity:.45;cursor:default}
.num{font-variant-numeric:tabular-nums}

/* verdict */
.verdict{border-radius:16px;padding:16px 16px 14px;color:#fff;background:var(--iron);display:flex;flex-direction:column;gap:6px}
.verdict.draw{background:linear-gradient(160deg,#2C7A4F,#1F5A3A)}
.verdict.stop{background:linear-gradient(160deg,#B8323F,#7E1F29)}
.verdict.boom{background:linear-gradient(160deg,#3A3543,#17151B)}
.verdict .word{font-family:Fraunces,Georgia,serif;font-size:54px;font-weight:900;line-height:1;letter-spacing:-.02em}
.verdict .why{font-size:14px;opacity:.9}
.verdict .stats{display:flex;gap:14px;font-size:13px;opacity:.95;flex-wrap:wrap}
.verdict .stats b{font-size:16px}

/* pot status */
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat .k{font-size:11px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:22px;font-weight:800;line-height:1.1}
.bombs{display:flex;gap:3px;margin-top:4px}
.bombs i{width:10px;height:10px;border-radius:50%;border:1px solid var(--ink2);display:block}
.bombs i.on{background:var(--ruby);border-color:var(--ruby)}

/* chip grid */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{position:relative;aspect-ratio:1;border-radius:50%;border:3px solid transparent;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;color:#fff;padding:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.chip .cnt{position:absolute;top:-4px;right:-4px;background:var(--ink);color:var(--bg);font-size:12px;border-radius:999px;padding:1px 7px;border:2px solid var(--bg)}
.chip.sel{outline:4px solid var(--gold)}
.c-W{background:#F7F2EA;color:#2A2230;border-color:#D9CFC3}
.c-O{background:#E8862E}
.c-G{background:#3C8C4C}
.c-B{background:#3D63C6}
.c-R{background:#C93A34}
.c-Y{background:#E6B92E;color:#2A2230}
.c-P{background:#7A46A8}
.c-K{background:#2A2230}
.chip:disabled{opacity:.25}
.legend{font-size:12px;color:var(--ink2);margin-top:8px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.bar button{flex:1;padding:14px;font-size:17px;border-radius:14px}
.bar button.stop{background:var(--ruby);border-color:var(--ruby);color:#fff}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,15,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal .box{background:var(--panel);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.modal h2{font-size:20px;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 14px}
.opt.best{border-color:var(--potion);background:var(--panel2)}
.opt .ev{color:var(--ink2);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--potion);color:#fff;margin-left:8px}
.mods{display:flex;gap:6px;flex-wrap:wrap}
.mods button.on{background:var(--potion-soft);border-color:var(--potion)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.kv b{font-size:16px}
.muted{color:var(--ink2);font-size:13px}
.log{font-size:13px;color:var(--ink2);margin-top:6px;max-height:80px;overflow:auto}
.hidden{display:none!important}
.bagedit{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.modrows{display:flex;flex-direction:column;gap:8px}
.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mr>span:first-child{flex:1 1 140px}
.bagedit .be{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:10px;padding:4px 6px}
.bagedit .be .chip{width:34px;height:34px;aspect-ratio:auto;font-size:14px;flex:none}
.bagedit .be b{flex:1;text-align:center;font-size:18px}
.bagedit .be button{padding:2px 8px;border-radius:8px}
.thinking{font-size:13px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.verdict{transition:background .25s}}
</style>

<div class="app" id="app"></div>

      const v=vvalue(next,b,droplet+steps,left,flask||refill);if(v>best.v)best={opt:o,steps,refill,v};}}

// ============================================================ VALUE
function phi(x){ // normal cdf
  const t=1/(1+.2316419*Math.abs(x)), d=.3989423*Math.exp(-x*x/2);
  let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return x>0?1-p:p;
}
function poisPmf(k,mu){if(k<0)return 0;let f=1;for(let i=2;i<=k;i++)f*=i;return Math.exp(-mu)*Math.pow(mu,k)/f;}
function poisCdf(k,mu){let s=0;for(let i=0;i<=k;i++)s+=poisPmf(i,mu);return s;}
function rat_tails(my,leader){if(leader<=my)return 0;return RAT_TAIL_VP.filter(t=>my<t&&t<leader).length;}

class Ctx{
  constructor(rnd,o={}){
    this.rnd=rnd; this.limit=o.limit||7; this.n_opp=o.n_opp??OPP.n;
    this.both=!!o.both; this.novp=o.novp||0; this.noruby=o.noruby||0; this.opp_black=OPP.opp_black[rnd];
    this.target=o.target||0; this.baseVp=o.baseVp||0; this.baseRubies=o.baseRubies||0;
    this.w_coin=WEIGHTS.coin[rnd]; this.w_ruby=WEIGHTS.ruby[rnd]; this.w_drop=WEIGHTS.droplet[rnd]; this.w_orange=WEIGHTS.orange[rnd];
    this.w_flask=rnd>=ROUNDS?0:1.5*this.w_ruby;
    const v={vp1:1,vp2:2,ruby:this.w_ruby,droplet:this.w_drop,orange:this.w_orange};
    this.die_ev=BONUS_DIE.reduce((a,f)=>a+v[f],0)/BONUS_DIE.length;
    this._die={};
  }
  blackOdds(b){const mu=this.opp_black,pl=poisCdf(b-1,mu),pe=poisPmf(b,mu);
    if(this.n_opp<=1)return[pl+pe,pl];return[1-(1-pl)**2,pl**2];}
  pWinDie(space){if(this.n_opp===0)return 1;if(this._die[space]!==undefined)return this._die[space];
    const m=OPP.best_space_mean[this.rnd],sd=OPP.best_space_sd,ps=OPP.p_survive;
    const p=(1-ps)+ps*phi((space-.5-m)/sd);return this._die[space]=p**this.n_opp;}
  terminal(pos,exploded,greens,purples,blacks,flaskUsed){
    if(this.target)return this.winProb(pos,exploded,greens,purples,blacks);
    if(this.pay)return this.terminalLearned(pos,exploded,greens,purples,blacks,flaskUsed);
    const space=pos+1,[coins,vp,ruby]=track(space);let rubies=ruby+greens,extra=0;
    if(purples>=3)extra+=2+this.w_drop;else if(purples===2){extra+=1;rubies+=1;}else if(purples===1)extra+=1;
    if(blacks>0){const[pd,pr]=this.blackOdds(blacks);extra+=pd*this.w_drop;rubies+=pr;}
    extra+=rubies*this.w_ruby; if(flaskUsed)extra-=this.w_flask;
    if(exploded&&!this.both)return Math.max(vp,coins*this.w_coin)+extra;
    let val=vp+coins*this.w_coin+extra;
    if(!exploded)val+=this.novp+this.noruby*this.w_ruby+this.pWinDie(space)*this.die_ev;
    return val;
  }
  terminalLearned(pos,exploded,greens,purples,blacks,fu){
    const t=this.pay,space=pos+1,[coins,vp,ruby]=track(space);let rub=ruby+greens,vpNow=0,dd=0;
    if(purples>=3){vpNow+=2;dd+=1;}else if(purples===2){vpNow+=1;rub+=1;}else if(purples===1)vpNow+=1;
    const[pd,pr]=blacks>0?this.blackOdds(blacks):[0,0];
    if(t.win){ // P(win) = sigmoid(logit of best shop + a*(projected margin + VP gained this round)), expected over the black outcome
      const h=(c,r,d,vpg,dz)=>{const s=z=>sigmoid(z+dz+t.a*(t.m0+vpg));return(1-pd)*s(t.get(c,r,d,fu))+(pd-pr)*s(t.get(c,r,d+1,fu))+pr*s(t.get(c,r+1,d+1,fu));};
      if(exploded&&!this.both)return Math.max(h(0,rub,dd,vp+vpNow,0),h(coins,rub,dd,vpNow,0));
      const vpg=vp+vpNow+(exploded?0:this.novp),nr=exploded?0:this.noruby,b=h(coins,rub+nr,dd,vpg,0);
      if(exploded)return b;
      const die=(2*h(coins,rub+nr,dd,vpg+1,0)+h(coins,rub+nr,dd,vpg+2,0)+h(coins,rub+nr+1,dd,vpg,0)+h(coins,rub+nr,dd+1,vpg,0)+h(coins,rub+nr,dd,vpg,t.dOrange))/6;
      return b+this.pWinDie(space)*(die-b);}
    const g=(c,r,d)=>(1-pd)*t.get(c,r,d,fu)+(pd-pr)*t.get(c,r,d+1,fu)+pr*t.get(c,r+1,d+1,fu);
    if(exploded&&!this.both)return vpNow+Math.max(vp+g(0,rub,dd),g(coins,rub,dd));
    const base=g(coins,rub,dd);let val=vp+vpNow+base;
    if(!exploded){const die=(1+1+2+(g(coins,rub+1,dd)-base)+(g(coins,rub,dd+1)-base)+t.dOrange)/6;val+=this.novp+this.noruby*1+this.pWinDie(space)*die;}
    return val;
  }
  // Final-round mode: probability that this round's outcome reaches the target score.
  winProb(pos,exploded,greens,purples,blacks){
    const space=pos+1,[coins,vp,ruby]=track(space);let rubies=this.baseRubies+ruby+greens,pts=this.baseVp;
    if(purples>=3)pts+=2;else if(purples===2){pts+=1;rubies+=1;}else if(purples===1)pts+=1;
    const[pd,pr]=blacks>0?this.blackOdds(blacks):[0,0];
    const need=(rb,extraVp)=>this.target-(pts+extraVp+Math.floor(rb/2));
    if(exploded&&!this.both){
      const best=Math.max(vp,Math.floor(coins/5));
      const p0=need(rubies,best)<=0?1:0,p1=need(rubies+1,best)<=0?1:0;
      return p0+(p1-p0)*pr;
    }
    const gained=vp+Math.floor(coins/5)+this.novp;
    const rb=rubies+this.noruby;
    const P=(r)=>{ // with r rubies, before the die
      const d=need(r,gained);if(d<=0)return 1;
      const pdie=exploded?0:this.pWinDie(space);
      // die faces: vp1 x2, vp2, ruby, droplet, orange
      let ok=0;if(d<=1)ok+=2;if(d<=2)ok+=1;if(need(r+1,gained)<=0)ok+=1;
      return pdie*ok/6;};
    return P(rb)+(P(rb+1)-P(rb))*pr;
  }
}

// ============================================================ BREW SOLVER
const S=(bag,pos,white,lastw,g1,g2,flask)=>({bag,pos,white,lastw,g1,g2,flask});
const rm=(bag,i)=>{const b=bag.slice();b[i]--;return b;};
const ad=(bag,i)=>{const b=bag.slice();b[i]++;return b;};
const tot=bag=>bag.reduce((a,b)=>a+b,0);
const skey=s=>s.bag.join(",")+"|"+s.pos+"|"+s.white+"|"+s.lastw+"|"+(s.g1?1:0)+(s.g2?1:0)+(s.flask?1:0);
function comb(n,k){if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);}
function* combos(bag,k,start=0){ if(k===0){yield[[],1];return;}
  for(let i=start;i<N;i++){const c=bag[i];if(!c)continue;
    for(let t=1;t<=Math.min(c,k);t++){const w=comb(c,t);
      for(const[rest,rw]of combos(bag,k-t,i+1))yield[new Array(t).fill(i).concat(rest),w*rw];}}}

class Abstract{
  constructor(ctx){this.ctx=ctx;this.memo=new Map();}
  eff(i,oranges){const c=COLOR[i];let v=VALUE[i];
    if(c==="R")v+=oranges>=3?2:(oranges>=1?1:0);else if(c==="B")v+={1:1,2:1,4:2}[v];else if(c==="Y")v+=.6;else if(c==="G")v+=.3*this.ctx.w_ruby;return v;}
  value(s,greens,purples,blacks,oranges){
    const w=[s.bag[I_W[1]],s.bag[I_W[2]],s.bag[I_W[3]]],safe=new Array(8).fill(0);
    for(let i=0;i<N;i++){const k=s.bag[i];if(!k||"WPK".includes(COLOR[i]))continue;safe[Math.min(Math.round(this.eff(i,oranges)),7)]+=k;}
    return this._v(w,safe,s.bag[I_P],s.bag[I_K],s.pos,s.white,s.flask,greens,purples,blacks);
  }
  _v(w,safe,pr,kr,pos,white,flask,g,p,b){
    const key=w.join()+"|"+safe.join()+"|"+pr+"|"+kr+"|"+pos+"|"+white+"|"+(flask?1:0)+"|"+g+p+b;
    const m=this.memo;if(m.has(key))return m.get(key);
    const ctx=this.ctx;let best=ctx.terminal(pos,false,g,p,b,!flask);
    const n=w[0]+w[1]+w[2]+safe.reduce((a,x)=>a+x,0)+pr+kr;
    if(n){let dv=0;
      for(let wi=0;wi<3;wi++){const k=w[wi];if(!k)continue;const v=wi+1,nw=white+v,np=Math.min(pos+v,LAST);let val;
        if(nw>ctx.limit)val=ctx.terminal(np,true,g,p,b,!flask);
        else{const w2=w.slice();w2[wi]--;val=this._v(w2,safe,pr,kr,np,nw,flask,g,p,b);
          if(flask)val=Math.max(val,this._v(w,safe,pr,kr,pos,white,false,g,p,b));}
        dv+=k*val;}
      for(let v=0;v<8;v++){const k=safe[v];if(!k)continue;const s2=safe.slice();s2[v]--;dv+=k*this._v(w,s2,pr,kr,Math.min(pos+v,LAST),white,flask,g,p,b);}
      if(pr)dv+=pr*this._v(w,safe,pr-1,kr,Math.min(pos+1,LAST),white,flask,g,p+1,b);
      if(kr)dv+=kr*this._v(w,safe,pr,kr-1,Math.min(pos+1,LAST),white,flask,g,p,b+1);
      dv/=n;if(dv>best)best=dv;}
    m.set(key,best);return best;
  }
}

class Brew{
  constructor(ctx,startBag,flaskFull=true,depth=2,abstract=null){
    this.ctx=ctx;this.depth=depth;this.startBag=startBag;this.nO=startBag[I_O];this.nP=startBag[I_P];this.nK=startBag[I_K];
    this.flaskFull=flaskFull;this.memo=new Map();this.bmemo=new Map();this.abstract=abstract||new Abstract(ctx);
  }
  start(droplet,rats=0){return S(this.startBag.slice(),droplet+rats,0,0,false,false,this.flaskFull);}
  term(s,exploded){return this.ctx.terminal(s.pos,exploded,(s.g1?1:0)+(s.g2?1:0),this.nP-s.bag[I_P],this.nK-s.bag[I_K],!s.flask);}
  stopValue(s){return this.term(s,false);}
  explodeProb(s){const n=tot(s.bag);if(!n)return 0;let c=0;for(let v=1;v<=3;v++)if(s.white+v>this.ctx.limit)c+=s.bag[I_W[v]];return c/n;}
  placed(s,i,retWhite=false){
    const c=COLOR[i];let v=VALUE[i],bag=s.bag,pos=s.pos,white=s.white,g1=s.g1,g2=s.g2;
    if(retWhite){bag=ad(bag,I_W[s.lastw]);pos-=s.lastw;white-=s.lastw;g1=g2;g2=false;}
    if(c==="W"){white+=v;pos+=v;return[S(bag,Math.min(pos,LAST),white,v,false,g1,s.flask),white>this.ctx.limit];}
    if(c==="R"){const o=this.nO-bag[I_O];v+=o>=3?2:(o>=1?1:0);}
    pos+=v;return[S(bag,Math.min(pos,LAST),white,0,c==="G",g1,s.flask),false];
  }
  useFlask(sb){return S(sb.bag,sb.pos,sb.white,sb.lastw,sb.g1,sb.g2,false);}
  V(s,d){ if(d===undefined)d=this.depth;const key=skey(s)+"#"+d;const m=this.memo;if(m.has(key))return m.get(key);
    let best=this.term(s,false);const n=tot(s.bag);
    if(n&&d<=0)best=Math.max(best,this.leaf(s));
    else if(n){let dv=0;for(let i=0;i<N;i++){const k=s.bag[i];if(k)dv+=k*this.place(S(rm(s.bag,i),s.pos,s.white,s.lastw,s.g1,s.g2,s.flask),i,s,d-1);}
      dv/=n;if(dv>best)best=dv;}
    m.set(key,best);return best;}
  leaf(s){return this.abstract.value(s,(s.g1?1:0)+(s.g2?1:0),this.nP-s.bag[I_P],this.nK-s.bag[I_K],this.nO-s.bag[I_O]);}
  drawValue(s,d){if(d===undefined)d=this.depth;const n=tot(s.bag);if(!n)return null;let dv=0;
    for(let i=0;i<N;i++){const k=s.bag[i];if(k)dv+=k*this.place(S(rm(s.bag,i),s.pos,s.white,s.lastw,s.g1,s.g2,s.flask),i,s,d-1);}return dv/n;}
  place(s,i,sb,d){const c=COLOR[i];const[s2,boom]=this.placed(s,i);
    if(c==="W"){if(boom)return this.term(s2,true);let val=this.V(s2,d);if(sb.flask)val=Math.max(val,this.V(this.useFlask(sb),d));return val;}
    if(c==="Y"&&s.lastw){const[s3]=this.placed(s,i,true);return Math.max(this.V(s2,d),this.V(s3,d));}
    if(c==="B")return this.blue(s2,VALUE[i],d);
    return this.V(s2,d);}
  blue(s,k,d){const key=skey(s)+"#"+k+"#"+d;if(this.bmemo.has(key))return this.bmemo.get(key);
    const n=tot(s.bag);k=Math.min(k,n);let val;
    if(k===0)val=this.V(s,d);else{val=0;const den=comb(n,k);
      for(const[combo,ways]of combos(s.bag,k)){let best=this.V(s,d);
        for(const j of combo)best=Math.max(best,this.place(S(rm(s.bag,j),s.pos,s.white,s.lastw,s.g1,s.g2,s.flask),j,s,d));
        val+=ways/den*best;}}
    this.bmemo.set(key,val);return val;}
  bluePickValues(s,combo){const out={none:this.V(s)};for(const j of new Set(combo))out[j]=this.place(S(rm(s.bag,j),s.pos,s.white,s.lastw,s.g1,s.g2,s.flask),j,s,this.depth);return out;}
  shouldDraw(s){const stop=this.stopValue(s),draw=this.drawValue(s);return[draw!==null&&draw>stop,stop,draw];}
}

function nextRoundEV(bag,droplet,flask,ctx,A,myVp){
  const rats=ctx.rnd>=2?rat_tails(myVp,OPP.leader_vp[ctx.rnd]):0;
  const b=new Brew(ctx,bag,flask,0,A);return b.V(b.start(droplet,rats));
}
const cost=opt=>opt.reduce((a,i)=>a+price(i),0);
let SHOP={discount:0,max:2};
const price=i=>Math.max(1,PRICES[NAME(i)]-SHOP.discount);
function purchaseOptions(coins,rnd){
  const avail=BUYABLE.filter(i=>UNLOCK[COLOR[i]]<=rnd+1&&price(i)<=coins);
  const opts=[[]];for(const i of avail)opts.push([i]);
  for(let a=0;a<avail.length;a++)for(let b=a+1;b<avail.length;b++){const i=avail[a],j=avail[b];
    if(COLOR[i]!==COLOR[j]&&price(i)+price(j)<=coins)opts.push([i,j]);}
  if(SHOP.max>=3)for(let a=0;a<avail.length;a++)for(let b=a+1;b<avail.length;b++)for(let c=b+1;c<avail.length;c++){
    const i=avail[a],j=avail[b],k=avail[c];const cs=new Set([COLOR[i],COLOR[j],COLOR[k]]);
    if(cs.size===3&&price(i)+price(j)+price(k)<=coins)opts.push([i,j,k]);}
  return opts;
}
function bestPurchase(bag,coins,rnd,droplet,flask,myVp,topSingles=5){
  const ctx=new Ctx(rnd+1),A=new Abstract(ctx);const opts=purchaseOptions(coins,rnd);
  const apply=o=>{let b=bag.slice();for(const i of o)b[i]++;return b;};
  const scored=new Map();const singles=opts.filter(o=>o.length===1);
  for(const o of[[],...singles])scored.set(o,nextRoundEV(apply(o),droplet,flask,ctx,A,myVp));
  const good=new Set(singles.slice().sort((x,y)=>scored.get(y)-scored.get(x)).slice(0,topSingles).map(o=>o[0]));
  for(const o of opts)if(o.length>=2&&o.every(i=>good.has(i)))scored.set(o,nextRoundEV(apply(o),droplet,flask,ctx,A,myVp));
  return[...scored.entries()].sort((a,b)=>b[1]-a[1]);
}
function rubyAdvice(bag,rubies,rnd,droplet,flask,myVp){
  const acts=[];if(rnd>=ROUNDS)return acts;const ctx=new Ctx(rnd+1),A=new Abstract(ctx);
  const left=ROUNDS-rnd,hold=2*WEIGHTS.ruby[rnd+1];
  while(rubies>=2){const base=nextRoundEV(bag,droplet,flask,ctx,A,myVp);
    const gd=(nextRoundEV(bag,droplet+1,flask,ctx,A,myVp)-base)*left;
    const gf=flask?0:nextRoundEV(bag,droplet,true,ctx,A,myVp)-base;
    const best=Math.max(gd,gf,hold);if(best===hold)break;rubies-=2;
    if(best===gd){droplet++;acts.push("droplet");}else{flask=true;acts.push("flask");}}
  return acts;
}

      <div class="mr"><span>Pot explodes above</span><span class="mods">${[7,8,9].map(v=>`<button class="small ${m.limit===v?"on":""}" data-limit="${v}">${v}</button>`).join("")}</span></div>
      <div class="mr"><span>Droplet +1 this round only</span><button class="small ${m.dropTemp?"on":""}" data-tog="dropTemp">${m.dropTemp?"Yes":"No"}</button></div>
      <div class="mr"><span>Exploded pots keep coins <i>and</i> VP</span><button class="small ${m.both?"on":""}" data-tog="both">${m.both?"Yes":"No"}</button></div>
      <div class="mr"><span>Bonus if you don't explode</span><span class="mods"><button class="small ${m.novp===1?"on":""}" data-novp="1">+1 VP</button><button class="small ${m.novp===2?"on":""}" data-novp="2">+2 VP</button><button class="small ${m.noruby?"on":""}" data-tog="noruby">+1 ruby</button></span></div>
      ${G.round>=2?`<div class="mr"><span>Rat tails</span><span class="mods"><button class="small ${m.ratsMult===0?"on":""}" data-rats="0">None this round</button><button class="small ${m.ratsMult===2?"on":""}" data-rats="2">Double</button><button class="small" id="ratminus">−1</button><b class="num">${m.ratsExtra>=0?"+":""}${m.ratsExtra}</b><button class="small" id="ratplus">+1</button></span></div>`:""}
      <div class="mr"><span>Shop this round</span><span class="mods"><button class="small ${m.discount===1?"on":""}" data-disc="1">1 coin off</button><button class="small ${m.discount===2?"on":""}" data-disc="2">2 off</button><button class="small ${m.maxBuy===3?"on":""}" data-tog3="maxBuy">Buy 3 chips</button></span></div>
    </div>
    <div class="muted" style="margin:10px 0 6px">Chips in or out of the bag <b>for this round only</b> (e.g. "set aside one white 1"):</div>
    <div class="bagedit">${CHIPS.map((c,i)=>(G.bag[i]||m.delta[i]>0)?`<div class="be">${chipBtn(i)}<b id="dl-${i}" class="num">${m.delta[i]>0?"+":""}${m.delta[i]}</b><button class="small" data-ddec="${i}">−</button><button class="small" data-dinc="${i}">+</button></div>`:"").join("")}</div>
    <div class="muted" style="margin:10px 0 6px">"Everyone receives…" cards — these are permanent:</div>
    <div class="mods"><button class="small" id="g-orange">+1 orange to bag</button><button class="small" id="g-white">+1 white 1 to bag</button><button class="small" id="g-ruby">+1 ruby</button><button class="small" id="g-vp">+1 VP</button><button class="small" id="g-drop">Droplet +1 (permanent)</button></div>
    <div class="muted" style="margin-top:6px">A card that lets you place a chip in the pot before drawing: just tap that chip first on the next screen.</div>
  </div>
  <div class="card"><h2>2 · Positions</h2>
    <div class="row"><label class="f grow">Droplet space<input type="number" id="f-drop2" min="0" value="${G.droplet}"></label>
    ${G.round>=2?`<label class="f grow">${VMODEL&&VMODEL.win?"Best opponent's VP":"Leader's VP"}<input type="number" id="f-leader" value="${G.leader??leaderDefault}"></label>`:""}
    ${G.round===ROUNDS?`<label class="f grow">Score to beat<input type="number" id="f-target" min="0" placeholder="optional" value="${m.target||""}"></label>`:""}</div>
    <div class="muted" style="margin-top:6px">Your VP: ${G.vp} · rubies ${G.rubies} · flask ${G.flask?"full":"empty"}.${G.round>=2?" Rat tails between you and the leader are added to your starting space.":""}${G.round===ROUNDS?" With a score to beat, the last round maximises your chance of reaching it instead of your average score.":""}</div>
    <div class="muted" style="margin-top:6px">Bag: ${fmtBag(G.bag)}</div></div>
  <div class="bar"><div class="in"><button class="ghost" id="back">Edit setup</button><button class="primary" id="go">Start brewing</button></div></div>`;
  const rr=()=>{m.target=+($("#f-target")?.value||0);G.droplet=Math.max(0,+$("#f-drop2").value||0);if($("#f-leader"))G.leader=+$("#f-leader").value||0;render();};
  app.querySelectorAll("[data-limit]").forEach(b=>b.onclick=()=>{m.limit=+b.dataset.limit;rr();});
  app.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{m[b.dataset.tog]=m[b.dataset.tog]?0:1;rr();});
  app.querySelectorAll("[data-tog3]").forEach(b=>b.onclick=()=>{m.maxBuy=m.maxBuy===3?2:3;rr();});
  app.querySelectorAll("[data-novp]").forEach(b=>b.onclick=()=>{const v=+b.dataset.novp;m.novp=m.novp===v?0:v;rr();});
  app.querySelectorAll("[data-rats]").forEach(b=>b.onclick=()=>{const v=+b.dataset.rats;m.ratsMult=m.ratsMult===v?1:v;rr();});
  app.querySelectorAll("[data-disc]").forEach(b=>b.onclick=()=>{const v=+b.dataset.disc;m.discount=m.discount===v?0:v;rr();});
  const r1=$("#ratminus"),r2=$("#ratplus");if(r1){r1.onclick=()=>{m.ratsExtra--;rr();};r2.onclick=()=>{m.ratsExtra++;rr();};}
  app.querySelectorAll("[data-dinc]").forEach(b=>b.onclick=()=>{const i=+b.dataset.dinc;m.delta[i]++;rr();});
  app.querySelectorAll("[data-ddec]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ddec;if(G.bag[i]+m.delta[i]>0)m.delta[i]--;rr();});
  $("#g-orange").onclick=()=>{G.bag[IDX.O1]++;rr();};$("#g-white").onclick=()=>{G.bag[IDX.W1]++;rr();};
  $("#g-ruby").onclick=()=>{G.rubies++;rr();};$("#g-vp").onclick=()=>{G.vp++;rr();};$("#g-drop").onclick=()=>{G.droplet++;rr();};
  $("#back").onclick=()=>{G.screen="setup";render();};
  $("#go").onclick=()=>{m.target=+($("#f-target")?.value||0);G.droplet=Math.max(0,+$("#f-drop2").value||0);G.leader=G.round>=2?(+$("#f-leader").value||0):0;startBrew();};
}

function startBrew(){
  const m=G.mods;let rats=G.round>=2?rat_tails(G.vp,G.leader):0;rats=Math.max(0,rats*m.ratsMult+m.ratsExtra);
  SHOP={discount:m.discount,max:m.maxBuy};
  G.ctx=new Ctx(G.round,{limit:m.limit,n_opp:G.nOpp,both:!!m.both,novp:m.novp,noruby:m.noruby,target:G.round===ROUNDS?m.target:0,baseVp:G.vp,baseRubies:G.rubies});
  const bag=G.bag.map((n,i)=>Math.max(0,n+m.delta[i]));
  if(VMODEL&&!G.ctx.target)G.ctx.pay=new PayTable(G.bag,G.round,G.droplet,G.rubies,G.flask,G.round>=2?G.vp-G.leader:0);
  G.brew=new Brew(G.ctx,bag,G.flask,tot(bag)>=22?1:2);
  G.verdictKey=null;
  G.S=G.brew.start(G.droplet+(m.dropTemp?1:0),rats);G.rats=rats;G.hist=[];G.log=[];G.exploded=false;
  G.screen="brew";render();
}

// ---------- brew
function renderBrew(){
  const s=G.S,b=G.brew,ctx=G.ctx;
  const k=skey(s);
  if(!G.exploded&&tot(s.bag)&&G.verdictKey!==k){ // solve off the render path so the tap registers first
    app.innerHTML=header(`Round ${G.round} · brewing`)+`<div class="verdict"><div class="word">…</div><div class="why">Working out the odds</div></div>`;
    setTimeout(()=>{G.verdict=b.shouldDraw(s);G.verdictKey=k;renderBrew();},20);return;}
  const[draw,stop,dv]=G.exploded||!tot(s.bag)?[false,0,null]:G.verdict;
  const pe=b.explodeProb(s);const space=s.pos+1;const[coins,vp,ruby]=track(space);
  const empty=tot(s.bag)===0;
  let verdict;
  if(G.exploded)verdict=`<div class="verdict boom"><div class="word">BOOM</div><div class="why">Pot exploded at space ${space}. Head to scoring.</div></div>`;
  else if(empty)verdict=`<div class="verdict stop"><div class="word">STOP</div><div class="why">Bag is empty.</div></div>`;
  else verdict=`<div class="verdict ${draw?"draw":"stop"}"><div class="word">${draw?"DRAW":"STOP"}</div>
    <div class="why">${whyVerdict(s,draw,stop,dv,pe)}</div>
    <div class="stats"><span>Explode next draw <b class="num">${Math.round(pe*100)}%</b></span>${ctx.target?`<span>Reach ${ctx.target} if you stop <b class="num">${Math.round(stop*100)}%</b></span><span>if you draw <b class="num">${Math.round(dv*100)}%</b></span>`:`<span>Stop <b class="num">${stop.toFixed(1)}</b></span><span>Draw <b class="num">${dv.toFixed(1)}</b></span>`}</div></div>`;
  const bombs=Array.from({length:ctx.limit},(_,i)=>`<i class="${i<s.white?"on":""}"></i>`).join("");
  app.innerHTML=header(`Round ${G.round} · brewing`)+verdict+`
  <div class="status">
    <div class="stat"><div class="k">Space</div><div class="v num">${space}</div></div>
    <div class="stat"><div class="k">Coins</div><div class="v num">${coins}</div></div>
    <div class="stat"><div class="k">VP</div><div class="v num">${vp}${ruby?" ♦":""}</div></div>
    <div class="stat"><div class="k">Bombs ${s.white}/${ctx.limit}</div><div class="bombs">${bombs}</div></div>
  </div>
  <div class="card"><h2>${G.exploded?"Chips drawn":"Tap the chip you drew"}</h2>
    <div class="chips">${CHIPS.map((c,i)=>s.bag[i]?chipBtn(i,"",s.bag[i]):"").join("")}</div>
    <div class="legend">${tot(s.bag)} chips left · flask ${s.flask?"ready":"used"} · start: droplet ${G.droplet}${G.mods.dropTemp?" +1 (card)":""}${G.rats?` + ${G.rats} rat tail${G.rats>1?"s":""}`:""} = space ${G.droplet+(G.mods.dropTemp?1:0)+G.rats}</div>
    ${G.log.length?`<div class="log">${G.log.map(esc).join("<br>")}</div>`:""}
  </div>
  <div class="bar"><div class="in">
    <button class="ghost" id="undo" ${G.hist.length?"":"disabled"}>Undo</button>
    ${G.exploded||empty?`<button class="primary" id="score">Score the round</button>`:`<button class="stop" id="stopb">Stop &amp; score</button>`}
  </div></div>`;
  if(!G.exploded)app.querySelectorAll(".chips .chip").forEach(el=>el.onclick=()=>onChip(+el.dataset.chip));
  $("#undo").onclick=()=>{const h=G.hist.pop();G.S=h.S;G.exploded=false;G.log=h.log;render();};
  const sc=$("#score")||$("#stopb");sc.onclick=()=>{G.screen="eval";render();};
}

function whyVerdict(s,draw,stop,dv,pe){
  const ctx=G.ctx,space=s.pos+1,[coins,vp]=track(space);const n=tot(s.bag);
  if(ctx.target){const need=ctx.target-(ctx.baseVp+vp+Math.floor(coins/5)+Math.floor(ctx.baseRubies/2));
    if(draw)return need<=0?`You'd already reach ${ctx.target} by stopping, but drawing keeps that chance and adds insurance — no white left can hurt you enough.`:`Stopping now leaves you ${need} short of ${ctx.target}. Drawing risks a ${Math.round(pe*100)}% explosion but is the only way to get there.`;
    return need<=0?`Stopping here reaches ${ctx.target} (space ${space}: ${vp} VP + ${Math.floor(coins/5)} from coins). Drawing only adds a ${Math.round(pe*100)}% chance of throwing it away.`:`You're ${need} short and drawing doesn't improve the odds enough — take the sure result.`;}
  const safe=n-[1,2,3].reduce((a,v)=>a+s.bag[I_W[v]],0);const okWhite=[1,2,3].filter(v=>s.white+v<=ctx.limit).reduce((a,v)=>a+s.bag[I_W[v]],0);
  const boomVal=Math.max(vp,coins*ctx.w_coin);const keep=vp>=coins*ctx.w_coin?`${vp} VP`:`${coins} coins`;
  const gain=(dv-stop).toFixed(1);
  if(draw){
    if(pe===0)return `No bomb can blow you up on this draw (${okWhite} safe white${okWhite===1?"":"s"}, ${safe} coloured). Nothing to lose.`;
    return `${Math.round(pe*100)}% chance to explode, but even then you'd keep ${keep} from space ${space}. The other ${n-Math.round(pe*n)} chips push you further — worth ~${gain} more than stopping.`;
  }
  return `Space ${space} already pays ${coins} coins and ${vp} VP${ctx.pWinDie(space)>0.5?" with a good shot at the bonus die":""}. A ${Math.round(pe*100)}% bomb risk would cost that${G.round===ROUNDS?"":" and the shop"}; the safe chips left don't add enough to justify it (~${(stop-dv).toFixed(1)} in favour of stopping).`;
}

function pushHist(){G.hist.push({S:G.S,log:G.log.slice()});}

function onChip(i){
  const b=G.brew,sb=G.S,ctx=G.ctx;const s=S(rm(sb.bag,i),sb.pos,sb.white,sb.lastw,sb.g1,sb.g2,sb.flask);const c=COLOR[i];
  const[s2,boom]=b.placed(s,i);
  pushHist();
  if(c==="W"){
    if(boom){G.S=s2;G.exploded=true;G.log.push(`Drew ${NAME(i)} — exploded`);render();return;}
    if(sb.flask){const keep=b.V(s2),ret=b.V(b.useFlask(sb));
      if(ret>keep){G.log.push(`Drew ${NAME(i)}`);G.S=s2;render();
        modal(`<h2>Use the flask?</h2><div class="muted">Returning this white ${VALUE[i]} drops your bombs from ${s2.white} back to ${sb.white} of ${ctx.limit}, so you can keep drawing with far less risk. It costs the flask (2 rubies to refill). Keep ${keep.toFixed(2)} vs return ${ret.toFixed(2)}.</div>
          <div class="opts"><button class="opt best" id="m-yes">Use flask — return it<span class="tag">Best</span></button><button class="opt" id="m-no">Keep it in the pot</button></div>`);
        $("#m-yes").onclick=()=>{G.S=b.useFlask(sb);G.log.push("Flask: returned "+NAME(i));render();};
        $("#m-no").onclick=()=>{render();};return;}}
    G.S=s2;G.log.push(`Drew ${NAME(i)}`);render();return;
  }
  if(c==="Y"&&s.lastw){const[s3]=b.placed(s,i,true);const keep=b.V(s2),ret=b.V(s3);G.S=s2;G.log.push(`Drew ${NAME(i)}`);render();
    modal(`<h2>Mandrake</h2><div class="muted">The chip before it was a white ${s.lastw}. Returning it lowers your bombs from ${s.white} to ${s.white-s.lastw} and you lose only ${s.lastw} space${s.lastw>1?"s":""}. Keep ${keep.toFixed(2)} vs return ${ret.toFixed(2)}.</div>
      <div class="opts"><button class="opt ${ret>keep?"best":""}" id="m-yes">Return the cherry bomb${ret>keep?'<span class="tag">Best</span>':""}</button><button class="opt ${ret>keep?"":"best"}" id="m-no">Keep it${ret>keep?"":'<span class="tag">Best</span>'}</button></div>`);
    $("#m-yes").onclick=()=>{G.S=s3;G.log.push("Mandrake: returned W"+s.lastw);render();};$("#m-no").onclick=()=>render();return;}
  if(c==="B"){G.S=s2;G.log.push(`Drew ${NAME(i)}`);render();blueModal(s2,Math.min(VALUE[i],tot(s2.bag)));return;}
  G.S=s2;G.log.push(`Drew ${NAME(i)}`);render();
}

function blueModal(s2,k){
  if(k===0)return;const picked=[];
  const draw=()=>{const left=s2.bag.slice();for(const j of picked)left[j]--;
    modal(`<h2>Crow skull: draw ${k}</h2><div class="muted">Tap the ${k} chip${k>1?"s":""} you pulled out (${picked.length}/${k}).</div>
      <div class="chips" style="margin-top:10px">${CHIPS.map((c,i)=>left[i]?chipBtn(i,"",left[i]):"").join("")}</div>
      <div class="row" style="margin-top:10px">${picked.map((j,n)=>`<span class="chip c-${COLOR[j]}" style="width:40px;height:40px;aspect-ratio:auto;font-size:16px">${VALUE[j]}</span>`).join("")}
      <span class="grow"></span><button class="small" id="m-clear">Clear</button></div>`);
    modalEl.querySelectorAll(".chips .chip").forEach(el=>el.onclick=()=>{picked.push(+el.dataset.chip);if(picked.length===k)choose();else draw();});
    $("#m-clear").onclick=()=>{picked.length=0;draw();};};
  const choose=()=>{const vals=G.brew.bluePickValues(s2,picked);const entries=Object.entries(vals).sort((a,b)=>b[1]-a[1]);const best=entries[0][0];
    modal(`<h2>Place which one?</h2><div class="opts">${entries.map(([j,v])=>`<button class="opt ${j===best?"best":""}" data-pick="${j}"><span>${j==="none"?"None — put them all back":"Place "+CNAME[COLOR[+j]]+" "+VALUE[+j]+(COLOR[+j]==="W"?" (adds "+VALUE[+j]+" bomb"+(VALUE[+j]>1?"s":"")+")":"")}${j===best?'<span class="tag">Best</span>':""}</span><span class="ev num">${v.toFixed(2)}</span></button>`).join("")}</div>`);
    modalEl.querySelectorAll("[data-pick]").forEach(el=>el.onclick=()=>{const j=el.dataset.pick;modalEl.innerHTML="";
      if(j==="none"){G.log.push("Crow skull: placed nothing");render();return;}
      G.hist.pop(); // the blue draw and its pick count as one undo step
      onChip(+j);});};
  draw();
}

function modal(html){modalEl.innerHTML=`<div class="modal"><div class="box">${html}</div></div>`;}

// ---------- evaluation
function renderEval(){
  const s=G.S,b=G.brew,ctx=G.ctx;const space=s.pos+1;const[coins,vp,ruby]=track(space);
  const greens=(s.g1?1:0)+(s.g2?1:0),purples=b.nP-s.bag[I_P],blacks=b.nK-s.bag[I_K];
  const takeVpRec=ctx.pay?((ctx.pay.win?ctx.pay.a:1)*vp+ctx.pay.get(0,0,0,!s.flask)>=ctx.pay.get(coins,0,0,!s.flask)):(vp>=coins*ctx.w_coin); // WIN model: compare in logit units
  G.ev=G.ev||{takeVp:takeVpRec,die:"none",moth:"droplet"};const e=G.ev;
  const pdie=Math.round(100*ctx.pWinDie(space));
  let purpleTxt="";if(purples>=3)purpleTxt="+2 VP, droplet +1";else if(purples===2)purpleTxt="+1 VP, +1 ruby";else if(purples===1)purpleTxt="+1 VP";
  app.innerHTML=header(`Round ${G.round} · scoring`)+`
  <div class="card"><h2>${G.exploded?"Exploded at":"Stopped at"} space ${space}</h2>
    <div class="kv"><span>Coins</span><b class="num">${coins}</b><span>Victory points</span><b class="num">${vp}</b><span>Ruby on this space</span><b>${ruby?"yes":"no"}</b>
    ${greens?`<span>Green in the last two chips</span><b>+${greens} ruby</b>`:""}${purples?`<span>Purple ×${purples}</span><b>${purpleTxt}</b>`:""}</div></div>
  ${G.exploded&&!ctx.both?`<div class="card"><h2>You can keep VP or coins</h2><div class="muted">${vp} VP vs ${coins} coins (worth ~${(coins*ctx.w_coin).toFixed(1)} VP now)</div>
    <div class="opts"><button class="opt ${e.takeVp?"best":""}" data-take="vp">Take the ${vp} VP${takeVpRec?'<span class="tag">Best</span>':""}</button><button class="opt ${!e.takeVp?"best":""}" data-take="coins">Take the ${coins} coins${!takeVpRec?'<span class="tag">Best</span>':""}</button></div></div>`:""}
  ${!G.exploded?`<div class="card"><h2>Bonus die</h2><div class="muted">You roll it if nobody who didn't explode is ahead of you (~${pdie}% by the model). What did you get?</div>
    <div class="mods" style="margin-top:8px">${["none","vp1","vp2","ruby","droplet","orange"].map(f=>`<button data-die="${f}" class="${e.die===f?"on":""}">${{none:"Didn't roll",vp1:"1 VP",vp2:"2 VP",ruby:"Ruby",droplet:"Droplet",orange:"Orange chip"}[f]}</button>`).join("")}</div></div>`:""}
  ${blacks?`<div class="card"><h2>Black ×${blacks}</h2><div class="muted">Compared with your neighbours' black chips:</div>
    <div class="mods" style="margin-top:8px">${["none","droplet","droplet+ruby"].map(f=>`<button data-moth="${f}" class="${e.moth===f?"on":""}">${{none:"Nothing",droplet:"Droplet +1","droplet+ruby":"Droplet +1 and ruby"}[f]}</button>`).join("")}</div></div>`:""}
  <div class="bar"><div class="in"><button class="ghost" id="back">Back</button><button class="primary" id="go">${G.round<ROUNDS?"Go shopping":"Final score"}</button></div></div>`;
  app.querySelectorAll("[data-take]").forEach(el=>el.onclick=()=>{e.takeVp=el.dataset.take==="vp";render();});
  app.querySelectorAll("[data-die]").forEach(el=>el.onclick=()=>{e.die=el.dataset.die;render();});
  app.querySelectorAll("[data-moth]").forEach(el=>el.onclick=()=>{e.moth=el.dataset.moth;render();});
  $("#back").onclick=()=>{G.ev=null;G.screen="brew";render();};
  $("#go").onclick=()=>{applyEval();};
}

function applyEval(){
  const s=G.S,b=G.brew,ctx=G.ctx,e=G.ev;const space=s.pos+1;let[coins,vp,ruby]=track(space);
  let rubies=ruby+(s.g1?1:0)+(s.g2?1:0),extra=0;const purples=b.nP-s.bag[I_P],blacks=b.nK-s.bag[I_K];
  if(purples>=3){extra+=2;G.droplet++;}else if(purples===2){extra+=1;rubies++;}else if(purples===1)extra+=1;
  if(blacks){if(e.moth!=="none")G.droplet++;if(e.moth==="droplet+ruby")rubies++;}
  if(G.exploded&&!ctx.both){if(e.takeVp)coins=0;else vp=0;}
  else if(!G.exploded){extra+=ctx.novp;rubies+=ctx.noruby;if(e.die==="vp1")extra+=1;else if(e.die==="vp2")extra+=2;else if(e.die==="ruby")rubies++;else if(e.die==="droplet")G.droplet++;else if(e.die==="orange")G.bag[I_O]++;}
  G.vp+=vp+extra;G.rubies+=rubies;G.flask=s.flask;G.coins=coins;G.ev=null;G.mods=null;G.extraWhiteDone=false;
  if(G.round<ROUNDS){G.screen="shop";G.shop=null;render();}else{G.screen="final";render();}
}

// ---------- shop
function renderShop(){
  if(!G.shop){app.innerHTML=header(`Round ${G.round} · shop`)+`<div class="card thinking">Working out the best buy…</div>`;
    setTimeout(()=>{
      let ranked;
      if(VMODEL){ // rank every purchase by whole-game value (rubies spent optimally for each)
        ranked=purchaseOptions(G.coins,G.round).map(o=>{const b=G.bag.slice();for(const i of o)b[i]++;
          let best=-Infinity;for(let st=0;st<=Math.floor(G.rubies/2);st++)for(const rf of[false,true]){if(rf&&(G.flask||G.rubies-2*st<2))continue;
            best=Math.max(best,vvalue(G.round+1,b,G.droplet+st,G.rubies-2*st-(rf?2:0),G.flask||rf));}
          return[o,best];}).sort((a,b)=>b[1]-a[1]);
      }else ranked=bestPurchase(G.bag,G.coins,G.round,G.droplet,G.flask,G.vp);
      G.shop={ranked,bought:ranked[0][0]};render();},30);return;}
  const sh=G.shop;const boughtKey=o=>o.join("-");
  const label=o=>o.length?o.map(i=>CNAME[COLOR[i]]+" "+VALUE[i]+" ("+PIC[COLOR[i]]+")").join(" + "):"Nothing";
  const base=sh.ranked.find(([o])=>o.length===0);const baseEv=base?base[1]:0;
  // WIN model: show each option as an estimated win chance (margin projected with the mean opponent gain this round)
  const winPct=VMODEL&&VMODEL.win?v=>(100*sigmoid(v+vmargin(G.round+1)*(G.vp-(G.leader||0)-VMODEL.opp_gain[G.round-1]))).toFixed(1)+"%":null;
  const why=o=>{if(!o.length)return "Save nothing — coins don't carry over, so buying is free value.";
    const parts=[...new Set(o.map(i=>COLOR[i]))].map(c=>WHY[c]);return parts.join(" ");};
  const bagAfter=G.bag.slice();for(const i of sh.bought)bagAfter[i]++;
  const rubiesNow=G.rubies;let acts;
  if(VMODEL){const r=bestShopLearned(bagAfter,0,rubiesNow,G.round,G.droplet,G.flask);acts=new Array(r.steps).fill("droplet");if(r.refill)acts.push("flask");}
  else acts=rubyAdvice(bagAfter,rubiesNow,G.round,G.droplet,G.flask,G.vp);
  const nDrop=acts.filter(a=>a==="droplet").length,doFlask=acts.includes("flask");
  sh.drop=sh.drop??0;sh.refill=sh.refill??false;
  const spend=2*sh.drop+(sh.refill?2:0);const recSpend=2*nDrop+(doFlask?2:0);
  app.innerHTML=header(`Round ${G.round} · shop`)+`
  <div class="card"><h2>${G.coins} coins to spend</h2><div class="muted" style="margin-bottom:6px">${winPct?"Ranked by your chance of winning the game (learned from self-play at 4-player tables).":VMODEL?"Ranked by expected points for the rest of the game (learned from self-play).":"Ranked by how much each buy raises next round's expected score (VP-equivalent, coins and rubies included)."} Tap what you actually bought.</div>
    <div class="opts">${sh.ranked.slice(0,7).map(([o,v],n)=>`<button class="opt ${boughtKey(o)===boughtKey(sh.bought)?"best":""}" data-buy="${n}"><span>${label(o)}${n===0?'<span class="tag">Best</span>':""}<div class="muted">${cost(o)} coins · ${winPct?`win chance ${winPct(v)} (nothing: ${winPct(baseEv)})`:`${VMODEL?"rest of game":"next round"} +${(v-baseEv).toFixed(2)} over buying nothing`}</div>${n===0||boughtKey(o)===boughtKey(sh.bought)?`<div class="muted" style="margin-top:4px">${why(o)}</div>`:""}</span><span class="ev num">${winPct?winPct(v):v.toFixed(2)}</span></button>`).join("")}</div></div>
  <div class="card"><h2>Rubies: ${rubiesNow}</h2>
    <div class="muted">Recommended: ${acts.length?acts.map(a=>a==="droplet"?"droplet +1":"refill flask").join(", "):"hold them"}. ${acts.includes("droplet")?"A droplet step is permanent — every remaining round starts one space further, which beats 1 VP at the end.":acts.includes("flask")?"An empty flask means no bomb take-back next round; refilling is worth more than holding.":"Two rubies are worth 1 VP at the end; nothing beats that right now."}</div>
    ${acts.length&&(sh.drop!==nDrop||sh.refill!==doFlask)?`<button class="primary small" id="apply-rec" style="margin-top:8px">Apply: ${acts.map(a=>a==="droplet"?"droplet +1":"refill flask").join(" + ")} (${recSpend} rubies)</button>`:""}
    <div class="row" style="margin-top:8px"><span class="grow">Droplet steps bought (2 rubies each) → droplet at ${G.droplet+sh.drop}</span><button class="small" id="dminus">−</button><b class="num" style="width:24px;text-align:center">${sh.drop}</b><button class="small" id="dplus">+</button></div>
    ${!G.flask?`<div class="row" style="margin-top:8px"><span class="grow">Refill flask (2 rubies)</span><button class="small ${sh.refill?"primary":""}" id="fl">${sh.refill?"Yes":"No"}</button></div>`:""}
    <div class="muted" style="margin-top:6px">${spend>rubiesNow?"<b>Not enough rubies for that.</b>":`Spending ${spend}, keeping ${rubiesNow-spend}. Move your droplet on the board now if you bought steps.`}</div></div>
  <div class="bar"><div class="in"><button class="primary" id="go" ${spend>rubiesNow?"disabled":""}>Next: round ${G.round+1}</button></div></div>`;
  app.querySelectorAll("[data-buy]").forEach(el=>el.onclick=()=>{sh.bought=sh.ranked[+el.dataset.buy][0];sh.drop=undefined;sh.refill=undefined;render();});
  $("#dminus").onclick=()=>{if(sh.drop>0)sh.drop--;render();};$("#dplus").onclick=()=>{sh.drop++;render();};
  const ar=$("#apply-rec");if(ar)ar.onclick=()=>{sh.drop=nDrop;sh.refill=doFlask;render();};
  const fl=$("#fl");if(fl)fl.onclick=()=>{sh.refill=!sh.refill;render();};
  $("#go").onclick=()=>{for(const i of sh.bought)G.bag[i]++;const d0=G.droplet;G.droplet+=sh.drop;G.rubies-=spend;if(sh.refill)G.flask=true;
    G.lastShop={text:`bought ${label(sh.bought)}${sh.drop?`; droplet ${d0} → ${G.droplet} (${sh.drop*2} rubies)`:""}${sh.refill?"; flask refilled (2 rubies)":""}; rubies left ${G.rubies}`};
    G.round++;G.screen="prebrew";render();};
}

function renderFinal(){
  const coins=G.coins,bonus=Math.floor(coins/5)+Math.floor(G.rubies/2);const total=G.vp+bonus;
  app.innerHTML=header("Final score")+`
  <div class="verdict"><div class="word num">${total} VP</div><div class="why">${G.vp} on the track + ${Math.floor(coins/5)} from ${coins} coins + ${Math.floor(G.rubies/2)} from ${G.rubies} rubies</div></div>
  <div class="card muted">Final bag: ${fmtBag(G.bag)}</div>
  <div class="bar"><div class="in"><button class="primary" id="new">New game</button></div></div>`;
  $("#new").onclick=newGame;
}

newGame();
</script>
